<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Memory — Match the Flag to the Country | FlagAtlas</title>
<meta name="description" content="A free flag memory game: flip the cards and match each flag to its country. Four difficulty levels, timer and scoring. Learn world flags by playing.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0C1A2B;        /* atlas ink / board       */
  --navy2:#13263C;       /* raised panels           */
  --line:#254257;        /* hairlines               */
  --paper:#F3E9D6;       /* parchment (country cards)*/
  --paper-ink:#2A2118;   /* text on parchment       */
  --gold:#E0A54B;        /* brass accent            */
  --gold-d:#B9812E;
  --mint:#37C6A2;        /* match                   */
  --coral:#E4694E;       /* mismatch                */
  --ink:#EAF1F8;         /* light text on navy      */
  --muted:#8AA1B6;
  --font-disp:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Outfit',system-ui,sans-serif;
  --font-mono:'Space Mono',ui-monospace,monospace;
}
body{
  font-family:var(--font-body);color:var(--ink);min-height:100vh;
  background:
    radial-gradient(1200px 700px at 78% -8%,rgba(224,165,75,.10),transparent 60%),
    radial-gradient(900px 600px at 5% 105%,rgba(55,198,162,.08),transparent 55%),
    var(--navy);
  padding:22px 16px 60px;
}
.wrap{max-width:820px;margin:0 auto}

/* ── Header ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .globe{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--gold),var(--gold-d));
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#20140a}
.brand b{font-family:var(--font-disp);font-weight:800;font-size:1.15rem;letter-spacing:-.2px}
.brand span{color:var(--muted);font-weight:500}
.title{font-family:var(--font-disp);font-weight:800;font-size:clamp(1.5rem,4.4vw,2.15rem);
  letter-spacing:-.5px;line-height:1}
.title .em{color:var(--gold)}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}

/* ── Difficulty segmented control ── */
.levels{display:flex;gap:6px;background:var(--navy2);border:1px solid var(--line);
  border-radius:100px;padding:5px;margin:18px 0 16px;flex-wrap:wrap}
.lvl{flex:1;min-width:70px;border:none;background:none;color:var(--muted);cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:.82rem;padding:9px 8px;border-radius:100px;
  transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.lvl small{font-family:var(--font-mono);font-size:.66rem;font-weight:400;opacity:.8}
.lvl:hover{color:var(--ink)}
.lvl.on{background:linear-gradient(150deg,var(--gold),var(--gold-d));color:#20140a}
.lvl.on small{opacity:.85}

/* ── Instrument panel (stats) ── */
.panel{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--navy2);padding:11px 8px;text-align:center}
.stat .k{font-size:.6rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--font-mono);font-weight:700;font-size:1.02rem;color:var(--ink);margin-top:3px}
.stat .v.gold{color:var(--gold)}
@media(max-width:520px){
  .panel{grid-template-columns:repeat(3,1fr)}
  .stat.s-score{grid-column:span 3}
}

/* ── Board ── */
.board{display:grid;gap:10px;margin:0 auto;width:100%}
.card{aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;
  perspective:800px;font-family:inherit}
.card:disabled{cursor:default}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .45s cubic-bezier(.4,.15,.2,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
/* cover */
.cover{background:linear-gradient(158deg,#1C3552,#0F2035);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.cover .emblem{font-size:clamp(1rem,4vw,1.7rem);color:var(--gold);opacity:.5}
.cover::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(224,165,75,.22);border-radius:8px}
/* content */
.content{transform:rotateY(180deg);background:var(--navy2);border:1px solid var(--line);padding:6px}
.content.flag{background:#0f2137}
.content.flag img{width:100%;height:100%;object-fit:contain;border-radius:5px;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.4))}
.content.name{background:var(--paper);color:var(--paper-ink)}
.content.name span{font-family:var(--font-disp);font-weight:600;
  font-size:clamp(.6rem,1.9vw,1rem);line-height:1.12;text-align:center;padding:2px;
  word-break:break-word}
/* states */
.card.matched .content{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint),0 6px 16px rgba(55,198,162,.25)}
.card.matched .inner{animation:pop .4s ease}
.card.wrong .content{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.card.wrong .inner{animation:shake .4s ease}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.07)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}

/* ── Win overlay ── */
.over{position:fixed;inset:0;background:rgba(6,14,24,.82);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.over.show{display:flex}
.modal{background:var(--navy2);border:1px solid var(--line);border-radius:20px;
  padding:30px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal .trophy{font-size:2.4rem}
.modal h2{font-family:var(--font-disp);font-weight:800;font-size:1.5rem;margin:6px 0 2px}
.pb{display:inline-block;background:var(--gold);color:#20140a;font-weight:700;font-size:.72rem;
  padding:3px 12px;border-radius:100px;margin:8px 0 4px;font-family:var(--font-mono)}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.mstats div{background:var(--navy2);padding:12px 8px}
.mstats .k{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.mstats .v{font-family:var(--font-mono);font-weight:700;font-size:1.25rem;margin-top:2px}
.mstats .v.gold{color:var(--gold)}
.btn{display:inline-block;background:linear-gradient(150deg,var(--gold),var(--gold-d));color:#20140a;
  border:none;font-family:var(--font-body);font-weight:800;font-size:.95rem;padding:13px 26px;
  border-radius:100px;cursor:pointer;width:100%;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);margin-top:9px}
.btn.ghost:hover{color:var(--ink)}

.hint{text-align:center;color:var(--muted);font-size:.82rem;margin-top:18px}
.hint b{color:var(--gold)}

@media(prefers-reduced-motion:reduce){
  .inner{transition:none}.card.matched .inner,.card.wrong .inner{animation:none}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a class="brand" href="/"><span class="globe">◍</span><b>Flag<span>Atlas</span></b></a>
    <div style="text-align:right">
      <div class="title">Flag <span class="em">Memory</span></div>
      <div class="sub">Match every flag to its country</div>
    </div>
  </div>

  <div class="levels" id="levels" role="tablist" aria-label="Difficulty">
    <button class="lvl on" data-diff="easy"   role="tab">Easy<small>4 × 4</small></button>
    <button class="lvl"    data-diff="medium" role="tab">Medium<small>4 × 6</small></button>
    <button class="lvl"    data-diff="hard"   role="tab">Hard<small>6 × 6</small></button>
    <button class="lvl"    data-diff="expert" role="tab">Expert<small>8 × 8</small></button>
  </div>

  <div class="panel" aria-live="polite">
    <div class="stat"><div class="k">Matches</div><div class="v" id="sMatches">0/0</div></div>
    <div class="stat"><div class="k">Attempts</div><div class="v" id="sAttempts">0</div></div>
    <div class="stat"><div class="k">Time</div><div class="v" id="sTime">00:00</div></div>
    <div class="stat s-score"><div class="k">Score</div><div class="v gold" id="sScore">0</div></div>
    <div class="stat"><div class="k">Best</div><div class="v" id="sBest">—</div></div>
  </div>

  <div class="board" id="board"></div>

  <p class="hint">Flip a <b>flag</b> and its <b>country name</b> to make a pair. Best score is saved on this device.</p>
</div>

<div class="over" id="over" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="modal">
    <div class="trophy">🏆</div>
    <h2 id="winTitle">Atlas complete!</h2>
    <div id="pbBadge"></div>
    <div class="mstats">
      <div><div class="k">Time</div><div class="v" id="mTime">00:00</div></div>
      <div><div class="k">Attempts</div><div class="v" id="mAttempts">0</div></div>
      <div><div class="k">Accuracy</div><div class="v" id="mAcc">0%</div></div>
      <div><div class="k">Score</div><div class="v gold" id="mScore">0</div></div>
    </div>
    <button class="btn" id="again">Play again</button>
    <button class="btn ghost" id="change">Change difficulty</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// Flag source. flagcdn.com serves real flag images (ISO 3166-1
// alpha-2, lowercase) that render on every OS — unlike emoji flags.
// To use FlagAtlas's own flag assets instead, change this one line,
// e.g.  return `/flags/${code}.svg`;
// ─────────────────────────────────────────────────────────────
function flagUrl(filename){ return `https://flagatlas.co.uk/flags/${filename}`; }

// Country pool — {code: ISO alpha-2, name: display name}
const COUNTRIES = [
  {code:'gb',name:'United Kingdom',flag:'united-kingdom-flag.png'},
  {code:'us',name:'United States',flag:'united-states-flag.png'},
  {code:'fr',name:'France',flag:'france-flag.png'},
  {code:'de',name:'Germany',flag:'germany-flag.png'},
  {code:'it',name:'Italy',flag:'italy-flag.png'},
  {code:'es',name:'Spain',flag:'spain-flag.png'},
  {code:'pt',name:'Portugal',flag:'portugal-flag.png'},
  {code:'nl',name:'Netherlands',flag:'netherlands-flag.png'},
  {code:'be',name:'Belgium',flag:'belgium-flag.png'},
  {code:'ch',name:'Switzerland',flag:'switzerland-flag.png'},
  {code:'se',name:'Sweden',flag:'sweden-flag.png'},
  {code:'no',name:'Norway',flag:'norway-flag.png'},
  {code:'dk',name:'Denmark',flag:'denmark-flag.png'},
  {code:'fi',name:'Finland',flag:'finland-flag.png'},
  {code:'ie',name:'Ireland',flag:'ireland-flag.png'},
  {code:'is',name:'Iceland',flag:'iceland-flag.png'},
  {code:'pl',name:'Poland',flag:'poland-flag.png'},
  {code:'gr',name:'Greece',flag:'greece-flag.png'},
  {code:'at',name:'Austria',flag:'austria-flag.png'},
  {code:'cz',name:'Czechia',flag:'czechia-flag.png'},
  {code:'hu',name:'Hungary',flag:'hungary-flag.png'},
  {code:'ro',name:'Romania',flag:'romania-flag.png'},
  {code:'hr',name:'Croatia',flag:'croatia-flag.png'},
  {code:'ua',name:'Ukraine',flag:'ukraine-flag.png'},
  {code:'tr',name:'Turkey',flag:'turkey-flag.png'},
  {code:'jp',name:'Japan',flag:'japan-flag.png'},
  {code:'cn',name:'China',flag:'china-flag.png'},
  {code:'kr',name:'South Korea',flag:'south-korea-flag.png'},
  {code:'in',name:'India',flag:'india-flag.png'},
  {code:'th',name:'Thailand',flag:'thailand-flag.png'},
  {code:'vn',name:'Vietnam',flag:'vietnam-flag.png'},
  {code:'id',name:'Indonesia',flag:'indonesia-flag.png'},
  {code:'ph',name:'Philippines',flag:'philippines-flag.png'},
  {code:'my',name:'Malaysia',flag:'malaysia-flag.png'},
  {code:'sg',name:'Singapore',flag:'singapore-flag.png'},
  {code:'pk',name:'Pakistan',flag:'pakistan-flag.png'},
  {code:'ca',name:'Canada',flag:'canada-flag.png'},
  {code:'mx',name:'Mexico',flag:'mexico-flag.png'},
  {code:'br',name:'Brazil',flag:'brazil-flag.png'},
  {code:'ar',name:'Argentina',flag:'argentina-flag.png'},
  {code:'cl',name:'Chile',flag:'chile-flag.png'},
  {code:'co',name:'Colombia',flag:'colombia-flag.png'},
  {code:'pe',name:'Peru',flag:'peru-flag.png'},
  {code:'au',name:'Australia',flag:'australia-flag.png'},
  {code:'nz',name:'New Zealand',flag:'new-zealand-flag.png'},
  {code:'za',name:'South Africa',flag:'south-africa-flag.png'},
  {code:'eg',name:'Egypt',flag:'egypt-flag.png'},
  {code:'ng',name:'Nigeria',flag:'nigeria-flag.png'},
  {code:'ke',name:'Kenya',flag:'kenya-flag.png'},
  {code:'ma',name:'Morocco',flag:'morocco-flag.png'},
  {code:'gh',name:'Ghana',flag:'ghana-flag.png'},
  {code:'sa',name:'Saudi Arabia',flag:'saudi-arabia-flag.png'},
  {code:'ae',name:'UAE',flag:'united-arab-emirates-flag.png'},
  {code:'il',name:'Israel',flag:'israel-flag.png'},
  {code:'rs',name:'Serbia',flag:'serbia-flag.png'}
];

const LEVELS = {
  easy:  {cols:4, rows:4, mult:1},
  medium:{cols:4, rows:6, mult:1.5},
  hard:  {cols:6, rows:6, mult:2},
  expert:{cols:8, rows:8, mult:3}
};

const $ = id => document.getElementById(id);
const board = $('board'), over = $('over');

let diff='easy', deck=[], first=null, lock=false;
let matches=0, pairs=0, attempts=0, elapsed=0, timer=null, started=false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function fmt(s){ const m=String(s/60|0).padStart(2,'0'), ss=String(s%60).padStart(2,'0'); return `${m}:${ss}`; }

function bestKey(){ return 'flagmemory_best_'+diff; }
function getBest(){ try{ return JSON.parse(localStorage.getItem(bestKey())); }catch(e){ return null; } }
function setBest(v){ try{ localStorage.setItem(bestKey(), JSON.stringify(v)); }catch(e){} }

function newGame(){
  const {cols,rows} = LEVELS[diff];
  pairs = (cols*rows)/2;
  matches=0; attempts=0; elapsed=0; first=null; lock=false; started=false;
  clearInterval(timer); timer=null;

  // pick countries, build flag + name cards, shuffle
  const chosen = shuffle([...COUNTRIES]).slice(0,pairs);
  deck = shuffle(chosen.flatMap((c,i)=>[
    {uid:'f'+i, code:c.code, name:c.name, flag:c.flag, type:'flag'},
    {uid:'n'+i, code:c.code, name:c.name, type:'name'}
  ]));

  board.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  board.style.maxWidth = Math.min(cols*128, 760)+'px';
  board.innerHTML = deck.map((card,i)=>{
    const content = card.type==='flag'
      ? `<span class="face content flag"><img src="${flagUrl(card.flag)}" alt="${card.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('beforeend', '<span style="color:#E4694E;font-size:.7rem;text-align:center">Flag unavailable</span>');"></span>`
      : `<span class="face content name"><span>${card.name}</span></span>`;
    return `<button class="card" data-i="${i}" aria-label="Hidden card">
      <span class="inner">
        <span class="face cover"><span class="emblem">◍</span></span>
        ${content}
      </span></button>`;
  }).join('');

  updatePanel();
  $('sBest').textContent = getBest() ? getBest().score : '—';
  [...board.children].forEach(el => el.addEventListener('click', ()=>flip(el)));
}

function startTimer(){
  started=true;
  timer=setInterval(()=>{ elapsed++; $('sTime').textContent=fmt(elapsed); },1000);
}

function updatePanel(){
  $('sMatches').textContent = `${matches}/${pairs}`;
  $('sAttempts').textContent = attempts;
  $('sTime').textContent = fmt(elapsed);
  $('sScore').textContent = liveScore();
}

function flip(el){
  const i = +el.dataset.i;
  if(lock || el.classList.contains('flip') || el.classList.contains('matched')) return;
  if(!started) startTimer();

  el.classList.add('flip');
  el.setAttribute('aria-label', deck[i].type==='flag' ? 'Flag: '+deck[i].name : deck[i].name);

  if(first===null){ first=el; return; }

  // second card → compare
  attempts++;
  const a = deck[+first.dataset.i], b = deck[i];
  if(a.code===b.code && first!==el){
    // match
    first.classList.add('matched'); el.classList.add('matched');
    first=null; matches++; updatePanel();
    if(matches===pairs) setTimeout(win, 500);
  } else {
    // mismatch
    lock=true;
    const f=first; first=null;
    f.classList.add('wrong'); el.classList.add('wrong');
    updatePanel();
    setTimeout(()=>{
      f.classList.remove('flip','wrong'); el.classList.remove('flip','wrong');
      f.setAttribute('aria-label','Hidden card'); el.setAttribute('aria-label','Hidden card');
      lock=false;
    }, 850);
  }
}

// Score: rewards accuracy, speed and difficulty.
function computeScore(done){
  const acc = attempts? Math.min(1, pairs/attempts) : 0;
  const base = matches*100*acc*LEVELS[diff].mult;
  const speed = done ? Math.max(0,(pairs*12 - elapsed))*LEVELS[diff].mult*2 : 0;
  return Math.round(base + speed);
}
const liveScore = ()=>computeScore(false);

function win(){
  clearInterval(timer);
  const score = computeScore(true);
  const acc = attempts? Math.round(pairs/attempts*100) : 100;
  $('mTime').textContent=fmt(elapsed);
  $('mAttempts').textContent=attempts;
  $('mAcc').textContent=acc+'%';
  $('mScore').textContent=score;
  $('sScore').textContent=score;

  const best=getBest();
  if(!best || score>best.score){
    setBest({score, time:elapsed, attempts});
    $('pbBadge').innerHTML='<span class="pb">🏆 New personal best!</span>';
    $('sBest').textContent=score;
  } else {
    $('pbBadge').innerHTML='';
  }
  over.classList.add('show');
}

// ── Controls ──
$('levels').addEventListener('click', e=>{
  const b=e.target.closest('.lvl'); if(!b) return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); diff=b.dataset.diff; newGame();
});
$('again').addEventListener('click', ()=>{ over.classList.remove('show'); newGame(); });
$('change').addEventListener('click', ()=>{ over.classList.remove('show'); document.querySelector('.levels').scrollIntoView({behavior:'smooth'}); });

newGame();
</script>
</body>
</html>
